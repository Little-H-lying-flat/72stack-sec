id: spring-actuator-env-exposure

info:
  name: Spring Boot Actuator /env Exposure
  author: grok-skill
  severity: high
  description: "Spring Boot Actuator env endpoint exposed without auth. Source payload: playbooks/unauth-access.md (5.3 heapdump chain)."
  reference:
  tags: spring,actuator,exposure,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/env"
    matchers:
      - type: word
        words:
          - "propertySources"
          - "management.endpoints"
        condition: or
      - type: status
        status:
          - 200
    matchers-condition: and
