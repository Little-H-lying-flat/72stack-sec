id: shiro-rememberme-detect

info:
  name: Apache Shiro Detection (rememberMe=deleteMe)
  author: grok-skill
  severity: info
  description: "Non-destructive Shiro fingerprint. Response sets rememberMe=deleteMe when Shiro is present - precondition for the deserialization chain (playbooks/rce/10-framework.md, shiro-deserialize)."
  reference:
  tags: shiro,fingerprint,deserialization

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "rememberMe=deleteMe"
