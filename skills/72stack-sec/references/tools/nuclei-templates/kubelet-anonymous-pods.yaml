id: kubelet-anonymous-pods

info:
  name: Kubelet Anonymous Pod Listing (10250)
  author: grok-skill
  severity: high
  description: "Kubelet HTTPS endpoint allows anonymous /pods read - pod specs may contain plaintext env credentials. Target https://{NODE}:10250, run nuclei with -insecure. Source: playbooks/cloud/40-k8s.md (k8s-api-unauth)."
  reference:
  tags: k8s,kubelet,unauth,cloud

http:
  - method: GET
    path:
      - "{{BaseURL}}/pods"
    matchers:
      - type: word
        words:
          - "\"kind\":\"PodList\""
        condition: and
      - type: status
        status:
          - 200
    matchers-condition: and
