id: aliyun-oss-anonymous-listing

info:
  name: Aliyun OSS Bucket Anonymous Listing
  author: 72stack-sec
  severity: medium
  description: OSS bucket allows anonymous ListObjects. Target the bucket host ({BUCKET}.oss-{region}.aliyuncs.com). Source: playbooks/ssrf-cache-host/11-cloud.md (cn-object-storage).
  reference:
    - https://github.com/Little-H-lying-flat/72stack-sec
  tags: oss,aliyun,misconfig,cloud

http:
  - method: GET
    path:
      - "{{BaseURL}}/?max-keys=20"
    matchers:
      - type: word
        words:
          - "<ListBucketResult"
          - "<Key>"
        condition: and
      - type: status
        status:
          - 200
    matchers-condition: and
